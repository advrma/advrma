<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Tech Stack">
<title>Tech Stack</title>
<defs>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#A3E635" stop-opacity="0"/><stop offset="1" stop-color="#A3E635" stop-opacity="0.9"/></linearGradient>
<linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#A3E635" stop-opacity="0.9"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<text x="600.0" y="26" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="3" fill="#A3E635" opacity="0.85">// 05</text>
<text x="600.0" y="62" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#E6EDF3" letter-spacing="-0.3">Tech Stack</text>
<text x="600.0" y="86" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B949E">tools I reach for every day</text>
<g>
<rect x="162.5" y="51" height="2" width="300" fill="url(#l)" rx="1"><animate attributeName="width" values="0;300" dur="1.1s" fill="freeze"/><animate attributeName="x" values="462.5;162.5" dur="1.1s" fill="freeze"/></rect>
<rect x="737.5" y="51" height="2" width="300" fill="url(#r)" rx="1"><animate attributeName="width" values="0;300" dur="1.1s" fill="freeze"/></rect>
<circle cx="462.5" cy="52" r="3.5" fill="#A3E635" filter="url(#glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="737.5" cy="52" r="3.5" fill="#A3E635" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cy="52" r="2.2" fill="#FFFFFF"><animate attributeName="cx" values="162.5;458.5" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
<circle cy="52" r="2.2" fill="#FFFFFF"><animate attributeName="cx" values="1037.5;741.5" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
</g>
</svg>
