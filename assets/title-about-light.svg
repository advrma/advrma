<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="About Me">
<title>About Me</title>
<defs>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#4D7C0F" stop-opacity="0"/><stop offset="1" stop-color="#4D7C0F" stop-opacity="0.9"/></linearGradient>
<linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#4D7C0F" stop-opacity="0.9"/><stop offset="1" stop-color="#4D7C0F" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<text x="600.0" y="26" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="3" fill="#4D7C0F" opacity="0.85">// 01</text>
<text x="600.0" y="62" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#1F2328" letter-spacing="-0.3">About Me</text>
<text x="600.0" y="86" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#59636E">who I am and what I'm working on</text>
<g>
<rect x="182.0" y="51" height="2" width="300" fill="url(#l)" rx="1"><animate attributeName="width" values="0;300" dur="1.1s" fill="freeze"/><animate attributeName="x" values="482.0;182.0" dur="1.1s" fill="freeze"/></rect>
<rect x="718.0" y="51" height="2" width="300" fill="url(#r)" rx="1"><animate attributeName="width" values="0;300" dur="1.1s" fill="freeze"/></rect>
<circle cx="482.0" cy="52" r="3.5" fill="#4D7C0F" filter="url(#glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="718.0" cy="52" r="3.5" fill="#4D7C0F" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cy="52" r="2.2" fill="#FFFFFF"><animate attributeName="cx" values="182.0;478.0" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
<circle cy="52" r="2.2" fill="#FFFFFF"><animate attributeName="cx" values="1018.0;722.0" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
