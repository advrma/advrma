name: Build profile (snake + dashboard)
 
on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # "Run workflow" button
  push:
    branches: [main]
 
permissions:
  contents: write
 
jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate lime snake (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#A3E635&color_dots=#161B22,#1A3B0F,#3F6212,#65A30D,#A3E635
            dist/snake-dark.svg?palette=github-dark&color_snake=#A3E635&color_dots=#161B22,#1A3B0F,#3F6212,#65A30D,#A3E635
            dist/snake-light.svg?palette=github-light&color_snake=#4D7C0F&color_dots=#EBEDF0,#D9F99D,#A3E635,#65A30D,#3F6212
 
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Build assets/dashboard.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/dashboard.py
 
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          if git commit -m "chore: refresh dashboard"; then
            git pull --rebase
            git push
          fi
 
